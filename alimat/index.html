<!DOCTYPE html>
<html lang='ur' dir='rtl'><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>نبوی منہج دعوت · عالمات کی ورک بک</title>
<link rel='stylesheet' href='style.css'>
</head><body>
<header class='top'><div class='in'>
<p class='kick'>اتالیق ٹریننگز · محاضر: وقاص سعید</p>
<h1>نبوی منہج دعوت · ورک بک</h1>
<p class='sub'>عالمات کے لیے · نشست 1 تا 4 · پہلے خود حل کریں، پھر جواب دیکھیں</p>
<div class='name'><label for='nm'>آپ کا نام:</label><input id='nm' autocomplete='name' placeholder='نام لکھیں'></div>
<div class='name'><label for='inst'>ادارے کا نام (اختیاری):</label><input id='inst' placeholder='مدرسہ، سکول یا حلقہ'></div>
<div class='name'><label for='ph'>واٹس ایپ نمبر (اختیاری):</label><input id='ph' inputmode='tel' autocomplete='tel' placeholder='03xx-xxxxxxx'></div>
</div></header>
<div class='wrap'>
<nav class='tabs' id='tabs' aria-label='نشستیں'></nav>
<main id='main'></main>
<footer>آپ کے جوابات اسی فون یا کمپیوٹر پر محفوظ رہتے ہیں، اس لیے بیچ میں چھوڑ کر بعد میں مکمل کر سکتی ہیں۔ · اتالیق ٹریننگز · ataleeq.org.pk</footer>
</div>
<script src='data.js'></script>
<script src='submit.js'></script>
<script src='app.js'></script>
</body></html>
