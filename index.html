<!DOCTYPE html>
<html lang="ur" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نبوی منہج دعوت · آن لائن ورک بک</title>
<style>
/* VOICE: باوقار، پرسکون، کتابچے جیسا
   IDEA: اتالیق کتابچے کا ایک ورق جو خود جانچتا ہے
   PICTURE: ہر نشست کا رنگین سرورقی پٹا اور سوالوں کے کارڈ
   COLOUR and TYPE: teal #11605a، copper #c0793a، کریم؛ جمیل نوری نستعلیق، عربی امیری
   LAYOUT: ایک کالم، اوپر نشستوں کی ٹیبیں، نیچے نتیجہ اور جمع کرانا */
@font-face{font-family:"Jameel";src:url(fonts/jameel.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Quran";src:url(fonts/amiri.woff2) format("woff2");font-display:swap}
:root{color-scheme:light dark;--bg:light-dark(#f7f3ea,#0f1b1a);--card:light-dark(#fffdf8,#162523);--ink:light-dark(#173a37,#e8efe9);--soft:light-dark(#5b6b68,#a9bbb7);--teal:light-dark(#11605a,#4fb3a8);--tealD:light-dark(#0b4743,#2c8a80);--cop:light-dark(#b0682f,#e0a774);--line:light-dark(#e3dccd,#28403d);--ok:light-dark(#e3f3ee,#173c35);--no:light-dark(#fbeee4,#3b2a1f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:21px/2 "Jameel","Noto Nastaliq Urdu",serif;overflow-x:clip}
.wrap{max-width:860px;margin:0 auto;padding:0 max(4vw,14px) 60px}
header.top{background:linear-gradient(270deg,#0b4743,#11605a);color:#f3ecdd;padding:26px max(4vw,14px) 18px}
header.top .in{max-width:860px;margin:0 auto}
.kick{color:#e0a774;font-size:18px;margin:0}
h1{font-size:44px;line-height:1.5;margin:0;font-weight:400}
.sub{margin:0;font-size:19px;opacity:.9}
.name{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.name label{font-size:19px}
.name input{flex:1;min-width:200px;font:inherit;font-size:20px;padding:4px 14px;border-radius:12px;border:0;background:#f7f3ea;color:#173a37;min-height:46px}
nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;position:sticky;top:0;background:var(--bg);z-index:5}
nav.tabs a{flex:none;text-decoration:none;color:var(--teal);border:1.5px solid var(--teal);border-radius:30px;padding:2px 18px;font-size:19px;min-height:44px;display:flex;align-items:center}
nav.tabs a.on{background:var(--teal);color:#fff}
nav.tabs a .d{font-family:system-ui;font-size:12px;margin-right:6px;opacity:.8}
.band{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 22px;margin:14px 0}
.unit{background:linear-gradient(270deg,var(--tealD),var(--teal));color:#fff;border:0}
.unit h2{margin:0;font-size:30px;line-height:1.7;font-weight:400}
.unit p{margin:0;font-size:18px;opacity:.9}
h3.part{color:var(--cop);font-size:24px;font-weight:400;margin:26px 0 0;border-bottom:1.5px solid var(--line)}
.hint{color:var(--soft);font-size:18px;margin:4px 0 0}
.case{border-right:5px solid var(--cop);background:light-dark(#fbf6ef,#1d2a22)}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 20px 16px;margin:12px 0}
.q .t{font-size:21px;margin:0 0 6px;color:var(--ink)}
.q .n{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;font:600 14px system-ui;align-items:center;justify-content:center;margin-left:10px;vertical-align:middle}
.ar,q{font-family:"Quran","Amiri",serif}
.opts{display:grid;gap:8px}
.opt{font:inherit;font-size:19px;text-align:right;background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:4px 14px;min-height:46px;cursor:pointer;line-height:1.9}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt:focus-visible,.btn:focus-visible,textarea:focus-visible{outline:3px solid var(--cop);outline-offset:2px}
.opt.right{background:var(--ok);border-color:var(--teal)}
.opt.wrong{background:var(--no);border-color:var(--cop)}
.opt:disabled{cursor:default}
.fb{margin:8px 0 0;padding:6px 14px;border-radius:12px;background:var(--ok);font-size:18px}
.fb b{color:var(--teal)}
textarea{width:100%;font:inherit;font-size:19px;line-height:2;border:1.5px solid var(--line);border-radius:12px;padding:6px 14px;background:transparent;color:var(--ink);min-height:120px;resize:vertical}
.btn{font:inherit;font-size:18px;border:1.5px solid var(--teal);color:var(--teal);background:transparent;border-radius:30px;padding:2px 18px;min-height:44px;cursor:pointer;margin-top:8px}
.btn.fill{background:var(--teal);color:#fff}
.private{border-style:dashed}
.score{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.score .big{font:700 34px system-ui;color:var(--teal);white-space:nowrap}
.done{color:var(--soft);font-size:18px}
footer{color:var(--soft);font-size:16px;text-align:center;margin-top:28px}
@media(max-width:600px){body{font-size:19px}h1{font-size:34px}.unit h2{font-size:25px}.q{padding:10px 14px 14px}}
</style></head><body>

 {id:"1FAIpQLSeSP05EQNPISe3Qir1BLm1oKSklfFYDaWDvziMAgWTonMvJwg", e:[1546902059,460722818,1452672390,1473795738,709622940,877610242,261593250,1010589430,332597642,2012425930]},
 {id:"1FAIpQLSfKg845wDIJK-hscO21N-d2ZZxX8aGzlsBqI5e1_9A5d597bw", e:[1285523346,1209548362,1191980018,1891949690,925638731,1964707171,1116490405,308995936,1838438615]},
 {id:"1FAIpQLSey5I8jyY_jSDdnSDqtfHAIPdNHgjpW-PSBUzwYBbBaOeyeRQ", e:[187387534,449666316,1041912060,1107411997,192758846,1615221969,856976682,1097518963,343847859,331313498,2130473558]},
 {id:"1FAIpQLSeexY7XcbscXXzELJ6CfpfWpIo47RW1ePP6swN5bzrNMBVctQ", e:[1423206575,1536512842,618133483,1822309562,379215579,788074829]}];
const SHORT = ["نشست 1 · دعوتِ دین","نشست 2 · مخاطب شناسی","نشست 3 · سماج شناسی","نشست 4 · پیغام شناسی","جامع مشق"];
const L = ["الف","ب","ج","د"];
let st = {};
try { st = JSON.parse(localStorage.getItem("nmd-wb") || "{}"); } catch (e) { st = {}; }
const save = () => { try { localStorage.setItem("nmd-wb", JSON.stringify(st)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = s => esc(s).replace(/«([^»]*[ً-ْ][^»]*)»/g, '«<span class="ar">$1</span>»');
const nm = document.getElementById("nm");
nm.value = st.name || "";
nm.addEventListener("input", () => { st.name = nm.value; save(); });
const ph = document.getElementById("ph");
ph.value = st.phone || "";
ph.addEventListener("input", () => { st.phone = ph.value; save(); });

function tabs(cur) {
  document.getElementById("tabs").innerHTML = SHORT.map((t, i) => {
    const s = stats(i);
    const d = st["sent" + i] ? ' <span class="d">✓</span>' : "";
    return `<a href="#s${i+1}" class="${i === cur ? "on" : ""}">${esc(t)}${d}</a>`;
  }).join("");
}
function stats(i) {
  let total = 0, answered = 0, right = 0;
  FORMS[i].items.forEach((it, k) => {
    const v = (st[i] || {})[k];
    if (it.t === "mcq") { total++; if (v !== undefined) { answered++; if (v === it.a) right++; } }
    if (it.t === "para") { total++; if (v && v.trim()) answered++; }
  });
  return { total, answered, right, mcq: FORMS[i].items.filter(x => x.t === "mcq").length };
}
function render(i) {
  const f = FORMS[i]; st[i] = st[i] || {};
  let n = 0, h = `<section class="band unit"><p>${esc(SHORT[i].split(" · ")[0])}</p><h2>${esc(f.title.split(" · ").slice(2).join(" · ") || f.title)}</h2></section>`;
  f.items.forEach((it, k) => {
    if (it.t === "h") {
      if (it.title.indexOf("صورت") > -1 || (it.d || "").indexOf("فرضی صورت") === 0) {
        h += `<h3 class="part">${esc(it.title)}</h3><div class="band case">${fmt(it.d || "")}</div>`;
      } else {
        h += `<h3 class="part">${esc(it.title)}</h3>` + (it.d ? `<p class="hint">${fmt(it.d)}</p>` : "");
      }
      return;
    }
    n++;
    const v = st[i][k];
    if (it.t === "mcq") {
      const answered = v !== undefined;
      h += `<div class="q"><p class="t"><span class="n">${n}</span>${fmt(it.q)}</p><div class="opts">` +
        it.o.map((o, j) => {
          let c = "opt";
          if (answered && j === it.a) c += " right";
          else if (answered && j === v) c += " wrong";
          return `<button class="${c}" data-k="${k}" data-j="${j}" ${answered ? "disabled" : ""}>${L[j]}) ${fmt(o)}</button>`;
        }).join("") + `</div>` +
        (answered ? `<p class="fb"><b>${v === it.a ? "درست ✓" : "درست جواب: " + L[it.a]}</b> · ${fmt(it.fb)}</p>` : "") + `</div>`;
    } else {
      const shown = (st[i]["show" + k]);
      const priv = it.t === "private";
      h += `<div class="q${priv ? " private" : ""}"><p class="t"><span class="n">${n}</span>${fmt(it.q)}</p>` +
        (it.h ? `<p class="hint">${fmt(it.h)}</p>` : "") +
        `<textarea data-k="${k}" aria-label="جواب">${esc(v || "")}</textarea>` +
        (priv ? "" : (shown ? `<p class="fb"><b>نمونہ جواب:</b> ${fmt(it.fb)}</p>` : `<button class="btn" data-show="${k}">نمونہ جواب دیکھیے</button>`)) + `</div>`;
    }
  });
  const s = stats(i);
  h += `<section class="band score" id="sc"><span class="big">${s.right}/${s.mcq}</span><span>کثیر الانتخابی سوالوں میں درست جوابات<br><span class="done">مکمل: ${s.answered} از ${s.total}</span></span></section>
  <div class="band" id="subbox"><p style="margin:0">سب سوال حل ہو جائیں تو جوابات جمع کرائیے۔ یہ سیدھے تربیت کار کے پاس پہنچ جائیں گے۔ «اپنا جائزہ» والے جواب جمع نہیں ہوں گے۔</p>
  <button class="btn fill" id="send">جوابات جمع کرائیں</button> <button class="btn" id="cp">جوابات کاپی کریں</button>
  <p class="done" id="msg" role="status">${st["sent" + i] ? "یہ نشست ایک بار جمع ہو چکی ہے۔ دوبارہ جمع کرانے سے نیا جواب الگ درج ہوگا۔" : ""}</p></div>`;
  document.getElementById("main").innerHTML = h;
  tabs(i);
}
function message(i) {
  const f = FORMS[i], s = stats(i);
  let m = `*${f.title}*\nنام: ${st.name || "—"}\nکثیر الانتخابی: ${s.right}/${s.mcq}\n`;
  let n = 0;
  f.items.forEach((it, k) => {
    if (it.t === "h") return; n++;
    if (it.t === "para") m += `\n${n}۔ ${it.q}\n${((st[i] || {})[k] || "—").trim()}\n`;
  });
  return m;
}
async function send(i) {
  const msg = document.getElementById("msg");
  const f = FORMS[i], sub = SUBMIT[i], a = st[i] || {};
  const missing = [];
  if (!(st.name || "").trim()) missing.push("نام");
  let n = 0;
  f.items.forEach((it, k) => {
    if (it.t === "h") return; n++;
    if (it.t === "mcq" && a[k] === undefined) missing.push("سوال " + n);
    if (it.t === "para" && !(a[k] || "").trim()) missing.push("سوال " + n);
  });
  if (missing.length) { msg.textContent = "ابھی یہ باقی ہیں: " + missing.join("، "); return; }
  const body = new URLSearchParams();
  body.append("entry." + sub.e[0], st.name.trim());
  body.append("entry." + sub.e[1], (st.phone || "").trim());
  let j = 2;
  f.items.forEach((it, k) => {
    if (it.t === "mcq") body.append("entry." + sub.e[j++], it.o[a[k]]);
    else if (it.t === "para") body.append("entry." + sub.e[j++], a[k].trim());
  });
  const b = document.getElementById("send"); b.disabled = true; msg.textContent = "بھیجا جا رہا ہے…";
  try {
    await fetch("https://docs.google.com/forms/d/e/" + sub.id + "/formResponse", { method: "POST", mode: "no-cors", body });
    st["sent" + i] = 1; save();
    msg.textContent = "جزاکم اللہ خیرا۔ آپ کے جوابات جمع ہو گئے۔";
    tabs(i);
  } catch (e) {
    msg.textContent = "انٹرنیٹ کا مسئلہ ہے؛ تھوڑی دیر بعد دوبارہ کوشش کیجیے۔";
  }
  b.disabled = false;
}
let cur = 0;
function route() {
  const m = /^#s([1-5])$/.exec(location.hash);
  cur = m ? +m[1] - 1 : 0;
  render(cur); window.scrollTo(0, 0);
}
document.getElementById("main").addEventListener("click", e => {
  const b = e.target.closest(".opt");
  if (b) { st[cur][b.dataset.k] = +b.dataset.j; save(); const y = window.scrollY; render(cur); window.scrollTo(0, y); return; }
  const sh = e.target.closest("[data-show]");
  if (sh) { st[cur]["show" + sh.dataset.show] = 1; save(); const y = window.scrollY; render(cur); window.scrollTo(0, y); return; }
  if (e.target.id === "send") { send(cur); return; }
  if (e.target.id === "cp") {
    navigator.clipboard.writeText(message(cur)).then(() => { document.getElementById("msg").textContent = "کاپی ہو گیا"; }, () => { document.getElementById("msg").textContent = "کاپی نہیں ہو سکا"; });
  }
});
document.getElementById("main").addEventListener("input", e => {
  if (e.target.tagName === "TEXTAREA") { st[cur][e.target.dataset.k] = e.target.value; save(); }
});
window.addEventListener("hashchange", route);
route();
}
</script>
